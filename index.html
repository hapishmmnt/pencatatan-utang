<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Utang Pribadi</title>
    <!-- Tailwind CSS untuk tampilan clean & minimalis -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <h1 class="text-xl font-semibold text-slate-900 mb-1">Catatan Utang</h1>
        <p class="text-xs text-slate-500 mb-6">Kelola utang piutang pribadi dengan ringkas.</p>

        <!-- Form Input -->
        <form id="debtForm" class="space-y-4 mb-8">
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Nama / Keterangan</label>
                <input type="text" id="name" required placeholder="Contoh: Budi" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Tanggal</label>
                    <input type="date" id="date" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nominal (Rp)</label>
                    <input type="number" id="amount" required placeholder="50000" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Status</label>
                <select id="status" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Belum Lunas">Belum Lunas</option>
                    <option value="Lunas">Lunas</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition">Tambah Catatan</button>
        </form>

        <!-- List Data -->
        <h2 class="text-sm font-semibold text-slate-700 mb-3">Daftar Utang</h2>
        <div id="debtList" class="space-y-3">
            <!-- Data akan muncul di sini secara otomatis -->
        </div>
    </div>

    <script>
        const debtForm = document.getElementById('debtForm');
        const debtList = document.getElementById('debtList');

        let debts = JSON.parse(localStorage.getItem('debts')) || [];

        function renderDebts() {
            debtList.innerHTML = '';
            if (debts.length === 0) {
                debtList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">Belum ada catatan utang.</p>`;
                return;
            }

            debts.forEach((debt, index) => {
                const isLunas = debt.status === 'Lunas';
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border flex justify-between items-center ${isLunas ? 'bg-emerald-50/50 border-emerald-100' : 'bg-rose-50/50 border-rose-100'}`;
                
                card.innerHTML = `
                    <div>
                        <p class="font-medium text-sm text-slate-800">${debt.name}</p>
                        <p class="text-xs text-slate-500">${debt.date} • Rp ${Number(debt.amount).toLocaleString('id-ID')}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs px-2 py-1 rounded-full font-medium ${isLunas ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">${debt.status}</span>
                        <button onclick="deleteDebt(${index})" class="text-slate-400 hover:text-rose-600 text-xs px-1">✕</button>
                    </div>
                `;
                debtList.appendChild(card);
            });
        }

        debtForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newDebt = {
                name: document.getElementById('name').value,
                date: document.getElementById('date').value,
                amount: document.getElementById('amount').value,
                status: document.getElementById('status').value
            };
            debts.push(newDebt);
            localStorage.setItem('debts', JSON.stringify(debts));
            debtForm.reset();
            renderDebts();
        });

        function deleteDebt(index) {
            debts.splice(index, 1);
            localStorage.setItem('debts', JSON.stringify(debts));
            renderDebts();
        }

        renderDebts();
    </script>
</body>
</html>
